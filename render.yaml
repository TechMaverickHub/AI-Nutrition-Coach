# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy with: Render Dashboard -> New -> Blueprint -> point at this repository.
services:
  - type: web
    name: ai-nutrition-coach-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    # Runs once per deploy, before traffic is shifted to the new instance.
    preDeployCommand: alembic upgrade head
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-nutrition-coach-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Set in the Render dashboard; never committed.
      - key: JWT_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini

databases:
  - name: ai-nutrition-coach-db
    plan: free
